[project]
name = "basicMLTemplate"
description = "A project that does ML stuff"
authors = ["DawnMagnet<axccjqh@qq.com>"]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.0"

[dependencies]
python = "3.12.*"
ipython = "*"
seaborn = "*"
timm = "*"
pip = ">=24.3.1,<25"
einops = "*"
setuptools = ">=75.6.0,<76"
opencv = ">=4.10.0,<5"
supervision = ">=0.25.1,<0.26"
cuda-version = "12.6"
pytorch-gpu = "*"

[tasks]
install-selective-scan = { cmd = "export CUDA_HOME=/opt/cuda && pip install .", cwd = "selective_scan" }
# you can replace with pip install "prebuild.whl" if you have a prebuild wheel

install-ultralytics = { cmd = "pip install -e .", cwd = "." }

post-install = { depends-on = [
    "install-selective-scan",
    "install-ultralytics",
] }

